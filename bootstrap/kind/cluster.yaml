kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubelab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30535
        hostPort: 30535
        protocol: TCP
      - containerPort: 30535
        hostPort: 30535
        protocol: UDP
    labels:
      ingress-ready: "true"
  - role: worker
  - role: worker
