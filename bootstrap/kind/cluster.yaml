kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubelab
nodes:
- role: control-plane
  extraPortMappings:
    - containerPort: 80
      hostPort: 80
      protocol: TCP
      listenAddress: "0.0.0.0"
    - containerPort: 443
      hostPort: 443
      protocol: TCP
      listenAddress: "0.0.0.0"
    - containerPort: 30535
      hostPort: 30535
      protocol: TCP
      listenAddress: "0.0.0.0"
    - containerPort: 30535
      hostPort: 30535
      protocol: UDP
      listenAddress: "0.0.0.0"
  labels:
    ingress-ready: "true"
- role: worker
- role: worker