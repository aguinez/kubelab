apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: apps
  labels:
    app: webhook
    owner: platform
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
        owner: platform
        environment: lab
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: webhook
          image: kubelab/webhook:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: N8N_WEBHOOK_URL
              value: http://n8n.apps.svc.cluster.local/webhook/argocd-diagnostic
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
