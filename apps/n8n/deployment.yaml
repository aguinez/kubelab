# n8n (tier de aplicación del POC).
#
# Un único Deployment que corre n8n con su SQLite local persistido en el PVC
# `n8n-data` (montado en /home/node/.n8n). La clave de cifrado de credenciales
# la genera y persiste n8n solo la primera vez, así que no hace falta un Secret
# en Git (regla 4: never store secrets in Git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: apps
  labels:
    app: n8n
    owner: platform
    environment: lab
spec:
  replicas: 1
  # Un solo writer sobre un PVC RWO: Recreate evita que dos pods peleen por el
  # volumen durante un rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        owner: platform
        environment: lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.45.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: N8N_HOST
              value: n8n.lab.test
            - name: N8N_PORT
              value: "5678"
            # TLS termina en el Ingress; n8n debe construir URLs https.
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://n8n.lab.test/
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.lab.test/
            # Hay un proxy delante (ingress-nginx).
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: GENERIC_TIMEZONE
              value: UTC
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
