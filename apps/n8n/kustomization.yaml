apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - rbac.yaml
# El workflow vive en Git y se monta como ConfigMap con nombre estable: el
# Deployment lo referencia como `n8n-workflows` (un nombre con hash no coincidiria
# con la referencia del volumen). El entrypoint lo reimporta al arrancar n8n.
configMapGenerator:
  - name: n8n-workflows
    files:
      - workflows/argocd-diagnostic.json
      - workflows/diagnose.sh
generatorOptions:
  disableNameSuffixHash: true
