apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-error-test
  namespace: apps
  labels:
    app: app-error-test
    owner: platform
    environment: lab
spec:
  replicas: 1
  # El pod vive FAIL_AFTER_SECONDS (30s) y muere antes de cumplir
  # minReadySeconds (45s), asi que el ReplicaSet nunca llega a "available",
  # el rollout no completa y ArgoCD marca el Deployment como Degraded
  # (ProgressDeadlineExceeded) pasados progressDeadlineSeconds.
  # minReadySeconds debe quedar por encima de FAIL_AFTER_SECONDS.
  progressDeadlineSeconds: 60
  minReadySeconds: 45
  selector:
    matchLabels:
      app: app-error-test
  template:
    metadata:
      labels:
        app: app-error-test
        owner: platform
        environment: lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app-error-test
          image: aguinezf/app-error-test
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FAIL_AFTER_SECONDS
              value: "30"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
