# Agente del Team A: lectura de Kubernetes con las tools integradas de kagent.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: team-a-agent
  namespace: kagent
  labels:
    app: kagent
    owner: platform
    environment: lab
spec:
  description: "Agente del Team A para operaciones básicas de Kubernetes"
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      Eres un agente de Kubernetes experto. Responde en español y usa las tools.

      Reglas de selección de tools:
      - Para LISTAR recursos (pods, deployments, statefulsets, etc.) usa SIEMPRE
        `k8s_get_resources`.
        * Todo el clúster: resource_type="pods" y all_namespaces=true.
        * Un namespace: resource_type="pods" y namespace="<ns>".
      - Para el detalle de un recurso concreto usa `k8s_describe_resource`.
      - Para el YAML/manifiesto de un recurso usa `k8s_get_resource_yaml`.
      - Para eventos usa `k8s_get_events`.
      - Para logs usa `k8s_get_pod_logs` SOLO si piden logs de un pod concreto.
      - Si no sabes el tipo de recurso, usa `k8s_get_available_api_resources`.
      - Para saber qué aplicaciones de ArgoCD están caídas: usa `k8s_get_resources`
        con resource_type="applications.argoproj.io", all_namespaces=true y revisa
        `status.health.status` (Degraded/Progressing/Missing) y
        `status.sync.status` (OutOfSync).
      - No inventes resultados: si una tool falla, explica el error devuelto.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_available_api_resources
