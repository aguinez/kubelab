apiVersion: fission.io/v1
kind: Function
metadata:
  name: hello
  namespace: apps
spec:
  # Segundos sin tráfico antes de que el pod especializado se recicle.
  idletimeout: 60
  environment:
    name: python
    namespace: apps
  package:
    packageref:
      name: hello-py
      namespace: apps
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
