apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-diagnostician
  namespace: apps
  labels:
    app: argocd-diagnostician
    owner: platform
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-diagnostician
  template:
    metadata:
      labels:
        app: argocd-diagnostician
        owner: platform
        environment: lab
    spec:
      serviceAccountName: argocd-diagnostician
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: diagnostician
          image: aguinezf/argocd-diagnostician
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ARGOCD_NAMESPACE
              value: argocd
            # Endpoint de reporte: aun NO definido. Vacio = solo se prepara el request.
            - name: REPORT_ENDPOINT
              value: ""
            # El informe queda como archivo dentro del pod, para leerlo con:
            #   kubectl -n apps exec deploy/argocd-diagnostician -- cat /tmp/report.json
            - name: REPORT_FILE
              value: /tmp/report.json
            - name: MAX_LOG_LINES
              value: "200"
            - name: MAX_SIGNATURES
              value: "25"
          # Durante un /diagnose el proceso esta ocupado (subprocess de kubectl +
          # parseo de JSON), asi que 1s de timeout hacia que kubelet cerrara la
          # conexion (BrokenPipe) y, a la larga, reiniciara el pod. Con margen.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
