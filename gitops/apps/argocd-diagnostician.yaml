apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-diagnostician
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Despues de argo-workflows (necesita sus CRDs para el WorkflowTemplate).
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://github.com/aguinez/kubelab.git
    targetRevision: main
    path: apps/argocd-diagnostician
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # El WorkflowTemplate usa CRDs que pueden no estar aun en el primer sync.
      - SkipDryRunOnMissingResource=true
