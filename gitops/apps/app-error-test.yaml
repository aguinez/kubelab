apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-error-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/aguinez/kubelab.git
    targetRevision: main
    path: apps/app_error_test_notification
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
