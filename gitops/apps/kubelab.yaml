# Application raíz de GitOps: sincroniza clusters/local desde el repo.
# Gestionado vía ArgoCD (la API registra el repo y crea el Application).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aguinez/kubelab
    targetRevision: HEAD
    path: clusters/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
