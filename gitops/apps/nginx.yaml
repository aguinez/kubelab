apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.12.0  # Última versión estable del chart
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          admissionWebhooks:
            enabled: true
            patch:
              enabled: true
              image:
                tag: v1.9.4
          service:
            type: NodePort
          ingressClassResource:
            default: true
            name: nginx
            controllerValue: k8s.io/ingress-nginx
          watchIngressWithoutClass: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true