# App de ejemplo (nginx) que valida el flujo completo:
#   localhost:443 -> ingress-nginx -> Service -> Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ingress-nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      hostNetwork: true,
      dnsPolicy: "ClusterFirstWithHostNet"
      containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: ingress-nginx
spec:
  selector:
    app: nginx-demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: ingress-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nginx.lab.test
      secretName: nginx-ingress-tls
  rules:
    - host: nginx.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-ingress-tls
  namespace: ingress-nginx
spec:
  secretName: nginx-ingress-tls
  commonName: nginx.lab.test
  dnsNames:
    - nginx.lab.test
  issuerRef:
    name: lab-issuer
    kind: ClusterIssuer
    group: cert-manager.io
