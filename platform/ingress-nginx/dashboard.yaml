# Dashboard / healthcheck de ingress-nginx.
#
# El controller de ingress-nginx no tiene dashboard web (a diferencia de
# Traefik). Se expone su endpoint de estado /healthz bajo el dominio del lab
# con TLS emitido por el ClusterIssuer interno (cert-manager).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-dashboard
  namespace: ingress-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - traefik.lab.test
      secretName: nginx-dashboard-tls
  rules:
    - host: traefik.lab.test
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: ingress-nginx-controller
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-dashboard-tls
  namespace: ingress-nginx
spec:
  secretName: nginx-dashboard-tls
  dnsNames:
    - traefik.lab.test
  issuerRef:
    name: lab-issuer
    kind: ClusterIssuer
    group: cert-manager.io
