# ============================================
# ARGOCD - HA / ESCALABLE (CON SHARDING)
# Chart: argo-cd | Version: 10.3.3 | ArgoCD: v3.5.1
# ============================================

global:
  image:
    tag: v3.5.1

# ============================================
# CONTROLLER (SHARDING)
# ============================================
controller:
  enabled: true
  replicas: 2
  sharding:
    enabled: true
    replicas: 2
    algorithm: consistent-hashing
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  extraArgs:
    - --status-processors=5
    - --operation-processors=3
    - --app-resync=60
    - --app-hard-resync=180
    - --metrics-port=8082
  metrics:
    enabled: true
    port: 8082
    serviceMonitor:
      enabled: false

# ============================================
# REPO-SERVER
# ============================================
repoServer:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  extraArgs:
    - --parallelismlimit=5
  autoscaling:
    enabled: false
  metrics:
    enabled: true
    port: 8084
    serviceMonitor:
      enabled: false

# ============================================
# REDIS
# ============================================
redis:
  enabled: true
  replicas: 3
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  sentinel:
    enabled: true
    replicas: 3
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  metrics:
    enabled: true
    port: 9121
    serviceMonitor:
      enabled: false
  cluster:
    enabled: true
    nodes: 3
    replicasPerNode: 1
  persistence:
    enabled: false

# ============================================
# SERVER
# ============================================
server:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  service:
    type: NodePort
    ports:
      - name: http
        port: 80
        targetPort: 8080
        nodePort: 30080
      - name: https
        port: 443
        targetPort: 8080
        nodePort: 30443
  metrics:
    enabled: true
    port: 8083
    serviceMonitor:
      enabled: false

# ============================================
# NOTIFICATIONS
# ============================================
notifications:
  enabled: true
  argocdUrl: https://argocd.lab.test
  # El ConfigMap argocd-notifications-cm lo gestiona el repo
  # (platform/argocd/notifications), no el chart, para evitar colisiones.
  cm:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================
# APPLICATION SET
# ============================================
applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ============================================
# CONFIGURACIONES
# ============================================
configs:
  params:
    controller.sharding.algorithm: "consistent-hashing"
    controller.sharding.enabled: "true"
    controller.sharding.replicas: "2"
    controller.replicas: "2"
    controller.status.processors: "5"
    controller.operation.processors: "3"
    app.resync: "60"
    app.hard.resync: "180"
    server.insecure: "true"
    metrics.enabled: "true"
    metrics.port: "8082"
    repo.metrics.enabled: "true"
    repo.metrics.port: "8084"
    server.metrics.enabled: "true"
    server.metrics.port: "8083"
  
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    url: https://argocd.lab.test
    admin.enabled: "true"
    app.resync: "60"
    app.hard.resync: "180"
    log.level: warn
  
  secret:
    createSecret: true

# ============================================
# RBAC
# ============================================
rbac:
  create: true
  policy: |
    g, system:cluster-admins, role:admin
  policy.default: role:readonly
  scopes: '[groups]'

# ============================================
# SERVICE ACCOUNTS
# ============================================
serviceAccounts:
  create: true

# ============================================
# PERMISOS DE CLUSTER
# ============================================
clusterCredentials:
  createClusterScopedResources: true
  clusterAdminAccess:
    enabled: true
  createAggregatedClusterRoles: true

# ============================================
# OTRAS CONFIGURACIONES
# ============================================
dex:
  enabled: false

persistence:
  enabled: false