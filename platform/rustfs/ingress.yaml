# Exposición de RustFS dentro del dominio interno del laboratorio.
#
#   - rustfs.lab.test     -> consola + API sobre el puerto 9001 (mismo origen,
#                            que es lo que espera la UI de RustFS)
#   - rustfs-s3.lab.test  -> API S3 dedicada sobre el puerto 9000 para las apps
#
# TLS termina en ingress-nginx con un certificado del ClusterIssuer interno
# `lab-issuer` (mismo patrón que n8n/sqlite/fission).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rustfs-tls
  namespace: rustfs
  labels:
    app: rustfs
    owner: platform
    environment: lab
spec:
  secretName: rustfs-tls
  commonName: rustfs.lab.test
  dnsNames:
    - rustfs.lab.test
    - rustfs-s3.lab.test
  issuerRef:
    name: lab-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console
  namespace: rustfs
  labels:
    app: rustfs
    owner: platform
    environment: lab
  annotations:
    nginx.ingress.kubernetes.io/app-root: /rustfs/console/
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rustfs.lab.test
      secretName: rustfs-tls
  rules:
    - host: rustfs.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-s3
  namespace: rustfs
  labels:
    app: rustfs
    owner: platform
    environment: lab
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rustfs-s3.lab.test
      secretName: rustfs-tls
  rules:
    - host: rustfs-s3.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9000
