apiVersion: apps.kubeblocks.io/v1
kind: ComponentVersion
metadata:
  name: rustfs
  labels:
    helm.sh/chart: rustfs-0.1.0
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-addon
    app.kubernetes.io/version: "1.0.0-beta.8"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    kubeblocks.io/crd-api-version: apps.kubeblocks.io/v1
spec:
  compatibilityRules:
    - releases:
        - 1.0.4
      compDefs:
        - ^rustfs-
  releases:
    - name: 1.0.4
      serviceVersion: 1.0.4
      images:
        rustfs: docker.io/rustfs/rustfs:1.0.4
        roleProbe: docker.io/rustfs/rustfs:1.0.4
        init: docker.io/apecloud/kubeblocks-tools:1.0.0
