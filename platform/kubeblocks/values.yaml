# Valores del operador KubeBlocks para el laboratorio (KinD).
#
# El registro por defecto del chart es el de Aliyun y no es alcanzable desde
# este entorno; se usan las mismas imágenes publicadas en Docker Hub.
image:
  registry: docker.io
  repository: apecloud/kubeblocks
  pullPolicy: IfNotPresent

addonChartsImage:
  registry: docker.io
  repository: apecloud/kubeblocks-charts

dataProtection:
  # Sin backups en el lab: evita depender del snapshot-controller y de las
  # VolumeSnapshot CRDs (RustFS no necesita snapshots aquí).
  enabled: false
  image:
    registry: docker.io
    datasafed:
      registry: docker.io

replicaCount: 1

# Recursos acotados: lab en una sola máquina.
resources:
  cpu: 250m
  memory: 512Mi

# No instalar addons de bases de datos automáticamente. RustFS se instala
# aparte con su propio chart (platform/rustfs).
autoInstalledAddons: []
